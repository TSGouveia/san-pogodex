name: Auto Scraper & Firebase Sync

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  # Allows manual run from GitHub Actions tab
  workflow_dispatch:
  # Runs on push to main or master
  push:
    branches:
      - main
      - master

jobs:
  scrape-and-sync-firebase:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ScrapedDuck-master/requirements.txt ]; then pip install -r ScrapedDuck-master/requirements.txt; fi

      - name: Run Scraper & Sync to Firebase Firestore
        run: |
          python ScrapedDuck-master/scrape.py
