name: Auto Scraper & Firebase Sync

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  # Allows manual run from GitHub Actions tab
  workflow_dispatch:
  # Runs on push to main or master
  push:
    branches:
      - main
      - master

jobs:
  scrape-and-sync-firebase:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ScrapedDuck-master/requirements.txt ]; then pip install -r ScrapedDuck-master/requirements.txt; fi

      - name: Run Scraper & Sync
        run: |
          python ScrapedDuck-master/scrape.py

      - name: Commit and Push Updated Scraped Files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Scraper]"
          git add files/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update scraped files [skip ci]" && git push)
