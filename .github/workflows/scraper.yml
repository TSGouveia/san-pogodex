name: Auto Scraper & Data Sync

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  # Allows manual run from GitHub Actions tab
  workflow_dispatch:
  # Runs on push to main or master, but only when the scraper itself changes
  # (site-only commits don't need fresh data and used to collide with the hourly run)
  push:
    branches:
      - main
      - master
    paths:
      - 'ScrapedDuck-master/**'
      - '.github/workflows/scraper.yml'

# Never run two scrapes at once: overlapping runs both pushed to the data branch and conflicted
concurrency:
  group: scraper-data-sync
  cancel-in-progress: false

jobs:
  scrape-and-sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main (code & scrapers)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout data branch (storage)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ScrapedDuck-master/requirements.txt ]; then pip install -r ScrapedDuck-master/requirements.txt; fi

      - name: Prepare initial data for scrapers
        run: |
          mkdir -p files
          cp -r data-branch/files/* files/ 2>/dev/null || true

      - name: Run Scraper
        run: |
          python ScrapedDuck-master/scrape.py

      - name: Commit and Push Updated Scraped Files to data branch
        run: |
          cd data-branch
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Scraper]"
          mkdir -p files
          cp -r ../files/* files/ 2>/dev/null || true
          cp -r ../ScrapedDuck-master/files/* files/ 2>/dev/null || true
          git add files/
          git status
          if ! git diff --quiet || ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "Auto-update scraped files - ${TIMESTAMP}"
            # Data is fully regenerated each run, so on conflict keep this run's files.
            # (During a rebase, -X theirs means "the commit being replayed", i.e. ours.)
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin data && git push origin data && break
              git rebase --abort 2>/dev/null || true
              if [ "$attempt" = "3" ]; then echo "Push failed after 3 attempts"; exit 1; fi
              sleep $((attempt * 5))
            done
            # Purge jsDelivr cache so the website gets the new data immediately
            curl -s "https://purge.jsdelivr.net/gh/TSGouveia/san-pogodex@data/files/metadata.json" || true
            curl -s "https://purge.jsdelivr.net/gh/TSGouveia/san-pogodex@data/files/events.min.json" || true
            curl -s "https://purge.jsdelivr.net/gh/TSGouveia/san-pogodex@data/files/events.json" || true
          fi
