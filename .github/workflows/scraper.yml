name: Auto Scraper

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  # Allows manual run from GitHub Actions tab
  workflow_dispatch:
  # Runs on push to main or master
  push:
    branches:
      - main
      - master

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ScrapedDuck-master/requirements.txt ]; then pip install -r ScrapedDuck-master/requirements.txt; fi

      - name: Run Scraper Orchestrator
        run: |
          python ScrapedDuck-master/scrape.py

      - name: Commit and push updated JSON files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f files/ ScrapedDuck-master/files/
          
          if git diff --staged --quiet; then
            echo "No changes detected in scraped data."
            exit 0
          else
            git commit -m "chore: auto-update scraped data from LeekDuck [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
