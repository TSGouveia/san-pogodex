name: Auto Scraper

on:
  schedule:
    # Corre a cada hora (ex: 13:00, 14:00, 15:00...)
    - cron: '0 * * * *'
  # Permite também correr manualmente a partir do separador Actions no GitHub
  workflow_dispatch:
  # Corre quando fizeres push para a branch main ou master
  push:
    branches:
      - main
      - master

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dá permissão para fazer push dos ficheiros JSON de volta ao repositório

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ScrapedDuck-master/requirements.txt ]; then pip install -r ScrapedDuck-master/requirements.txt; fi

      - name: Run Scraper
        run: |
          cd ScrapedDuck-master
          python scrape.py
          # Copia os ficheiros atualizados para a pasta /files da raiz do projeto
          cp -r files/* ../files/

      - name: Commit and push updated JSON files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f files/ ScrapedDuck-master/files/
          
          # Só faz commit se houver alterações nos ficheiros
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos dados do scraper."
          else
            git commit -m "chore: auto-update scraped data [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
