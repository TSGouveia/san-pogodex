name: Auto Scraper & Data Sync

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  # Allows manual run from GitHub Actions tab
  workflow_dispatch:
  # Runs on push to main or master
  push:
    branches:
      - main
      - master

jobs:
  scrape-and-sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main (code & scrapers)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout data branch (storage)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ScrapedDuck-master/requirements.txt ]; then pip install -r ScrapedDuck-master/requirements.txt; fi

      - name: Prepare initial data for scrapers
        run: |
          mkdir -p files
          cp -r data-branch/files/* files/ 2>/dev/null || true

      - name: Run Scraper
        run: |
          python ScrapedDuck-master/scrape.py

      - name: Commit and Push Updated Scraped Files to data branch
        run: |
          cd data-branch
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Scraper]"
          mkdir -p files
          cp -r ../files/* files/ 2>/dev/null || true
          cp -r ../ScrapedDuck-master/files/* files/ 2>/dev/null || true
          git add files/
          git status
          if ! git diff --quiet || ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "Auto-update scraped files - ${TIMESTAMP}"
            git pull --rebase origin data
            git push origin data
            # Purge jsDelivr cache so the website gets the new data immediately
            curl -s "https://purge.jsdelivr.net/gh/TSGouveia/san-pogodex@data/files/metadata.json" || true
            curl -s "https://purge.jsdelivr.net/gh/TSGouveia/san-pogodex@data/files/events.min.json" || true
            curl -s "https://purge.jsdelivr.net/gh/TSGouveia/san-pogodex@data/files/events.json" || true
          fi
