<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoGo Events Infographic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0f1115; color:#e9ecf2; font-family:Nunito, system-ui, sans-serif; }
  .bar { display:flex; gap:8px; align-items:center; justify-content:center; padding:14px; flex-wrap:wrap; }
  .bar button { background:#181b22; color:#e9ecf2; border:1px solid #2a2f3a; border-radius:8px; padding:8px 14px; font:inherit; font-weight:800; cursor:pointer; }
  .bar button.on { background:#c2185b; border-color:#c2185b; }
  .bar .status { font-size:13px; color:#8f97a8; min-width:120px; text-align:center; }
  html.embed .bar { display:none; }
  .stage { display:flex; justify-content:center; padding:0 0 24px; }
  html.embed .stage { padding:0; }

  /* ---------- Poster ---------- */
  .poster { --h1:#7c3aed; --h2:#c2185b; width:1080px; position:relative; overflow:hidden; color:#eef1f6;
    background:
      radial-gradient(700px 600px at 0% 20%, color-mix(in srgb, var(--h1) 34%, transparent), transparent 65%),
      radial-gradient(800px 700px at 100% 60%, color-mix(in srgb, var(--h2) 26%, transparent), transparent 65%),
      linear-gradient(180deg, #15111f, #0b0a10); }
  .poster::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background-image:
      radial-gradient(1.6px 1.6px at 23px 41px, #fff, transparent),
      radial-gradient(1px 1px at 97px 133px, #fff, transparent),
      radial-gradient(2px 2px at 161px 72px, rgba(255,255,255,.8), transparent),
      radial-gradient(1.2px 1.2px at 211px 187px, #fff, transparent),
      radial-gradient(1.4px 1.4px at 58px 222px, rgba(255,255,255,.7), transparent);
    background-size:240px 240px; }
  .poster > * { position:relative; }

  .p-head { overflow:hidden; padding:38px 44px 30px; color:#fff; background:linear-gradient(120deg, var(--h1), var(--h2)); }
  .p-head::before, .p-head::after { content:""; position:absolute; border-radius:50%; background:rgba(255,255,255,.10); }
  .p-head::before { width:380px; height:380px; right:-110px; top:-190px; }
  .p-head::after { width:220px; height:220px; right:150px; top:50px; background:rgba(255,255,255,.07); }
  .p-eyebrow { position:relative; display:inline-block; background:rgba(255,255,255,.2); padding:5px 14px; border-radius:99px; font-weight:900; font-size:15px; letter-spacing:.12em; text-transform:uppercase; }
  .p-title { position:relative; font-size:72px; line-height:1; font-weight:900; margin:12px 0 8px; text-shadow:0 3px 0 rgba(0,0,0,.14); }
  .p-sub { position:relative; font-size:21px; font-weight:700; opacity:.9; }

  .poster { height:1920px; display:flex; flex-direction:column; }
  .p-head, .p-foot { flex-shrink:0; }
  .p-wrap { flex:1; min-height:0; overflow:hidden; position:relative; }
  .p-body { padding:26px 30px 10px; display:flex; flex-direction:column; gap:22px; width:1080px; box-sizing:border-box; transform-origin:top left; }
  .p-body.spread { justify-content:space-evenly; }
  .sec-t { display:flex; align-items:center; gap:12px; font-size:16px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.65); }
  .sec-t::after { content:""; flex:1; height:2px; border-radius:2px; background:rgba(255,255,255,.08); }

  /* ---------- Week: one card per day event ---------- */
  .days { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:30px 18px; padding-top:14px; }
  .dcard { --c:#60a5fa; --g:#60a5fa; position:relative; min-height:178px; border-radius:20px; padding:30px 20px 18px 22px; display:flex; align-items:center; gap:8px;
    background:
      radial-gradient(240px 200px at 85% 55%, color-mix(in srgb, var(--g) 32%, transparent), transparent 70%),
      linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08), 0 4px 0 rgba(0,0,0,.3); }
  .dcard .tab { position:absolute; left:16px; top:-16px; background:var(--c); color:#14111b; font-weight:900; font-size:21px; line-height:1; padding:8px 14px 7px; border-radius:11px; box-shadow:0 3px 0 rgba(0,0,0,.3); }
  .dcard .tab small { font-size:14px; letter-spacing:.08em; margin-right:6px; opacity:.75; }
  .dcard .tx { flex:1; min-width:0; position:relative; z-index:2; }
  .dcard .kind { font-size:13px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; color:var(--c); }
  .dcard .nm { font-size:28px; font-weight:900; line-height:1.08; margin:4px 0 6px; text-shadow:0 2px 0 rgba(0,0,0,.25); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .dcard .nm.long { font-size:22px; }
  .dcard .tm { display:inline-flex; align-items:center; gap:6px; font-size:16px; font-weight:800; color:rgba(255,255,255,.8); background:rgba(0,0,0,.25); padding:4px 10px; border-radius:8px; }
  .dcard .loc { display:inline-block; margin-left:6px; font-size:13px; font-weight:900; color:#fda4af; }
  .dcard .art { flex-shrink:0; width:190px; height:150px; position:relative; }
  .dcard .art img { position:absolute; object-fit:contain; filter:drop-shadow(0 6px 6px rgba(0,0,0,.45)); }
  .dcard .art.n1 img { left:0; top:-10px; width:100%; height:170px; }
  .dcard .art.n2 img { width:120px; height:120px; } .dcard .art.n2 img:nth-child(1){ left:0; top:0; } .dcard .art.n2 img:nth-child(2){ right:0; bottom:-6px; }
  .dcard .art.n3 img { width:104px; height:104px; } .dcard .art.n3 img:nth-child(1){ left:43px; top:-14px; } .dcard .art.n3 img:nth-child(2){ left:-4px; bottom:-8px; } .dcard .art.n3 img:nth-child(3){ right:-4px; bottom:-8px; }
  .dcard .art.n4 img { width:92px; height:92px; } .dcard .art.n4 img:nth-child(1){ left:0; top:-6px; } .dcard .art.n4 img:nth-child(2){ right:0; top:-6px; } .dcard .art.n4 img:nth-child(3){ left:0; bottom:-6px; } .dcard .art.n4 img:nth-child(4){ right:0; bottom:-6px; }
  .dcard .art.banner img { left:0; top:10px; width:100%; height:130px; object-fit:cover; border-radius:14px; filter:none; box-shadow:0 4px 12px rgba(0,0,0,.4); }

  /* ---------- Month: calendar grid with sprites ---------- */
  .mhead, .mgrid { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:7px; }
  .mhead { text-align:center; font-size:14px; font-weight:900; letter-spacing:.14em; color:rgba(255,255,255,.55); margin-bottom:-12px; }
  .cell { --c:transparent; min-height:118px; border-radius:14px; padding:6px 6px 8px; display:flex; flex-direction:column; gap:5px;
    background:rgba(255,255,255,.035); box-shadow:inset 0 0 0 1px rgba(255,255,255,.06); }
  .cell.has { background:linear-gradient(180deg, color-mix(in srgb, var(--c) 22%, transparent), rgba(255,255,255,.04)); box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--c) 45%, transparent); }
  .cell.out { opacity:.28; }
  .cell .dn { font-size:19px; font-weight:900; line-height:1; padding:2px 3px; }
  .mev { --c:#60a5fa; text-align:center; }
  .mev + .mev { border-top:1px dashed rgba(255,255,255,.12); padding-top:5px; }
  .mev .sp { display:flex; justify-content:center; height:58px; }
  .mev .sp img { width:58px; height:58px; object-fit:contain; filter:drop-shadow(0 3px 3px rgba(0,0,0,.45)); }
  .mev .sp.n2 img { width:46px; margin:0 -4px; }
  .mev .sp.n3 img { width:40px; margin:0 -4px; }
  .mev .k { display:inline-block; font-size:10.5px; font-weight:900; letter-spacing:.06em; text-transform:uppercase; color:#14111b; background:var(--c); padding:1px 6px; border-radius:5px; }
  .mev .n { font-size:12.5px; font-weight:900; line-height:1.15; margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .mev .t { font-size:11.5px; font-weight:800; color:rgba(255,255,255,.65); }

  /* ---------- Raid bosses ---------- */
  /* week: day-by-day rows */
  .wk { display:flex; flex-direction:column; gap:12px; }
  .p-body.spread .wk { flex:1; }
  .wday { display:grid; grid-template-columns:118px minmax(0, 1fr); gap:14px; }
  .wday.has { flex:1 1 auto; }
  .wdate { border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 0; line-height:1;
    background:linear-gradient(160deg, color-mix(in srgb, var(--c) 26%, transparent), rgba(255,255,255,.03)); box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--c) 40%, transparent); }
  .wdate small { font-size:15px; font-weight:900; letter-spacing:.14em; color:color-mix(in srgb, var(--c) 55%, #fff); }
  .wdate b { font-size:50px; font-weight:900; margin:4px 0 2px; }
  .wdate span { font-size:15px; font-weight:800; color:rgba(255,255,255,.55); }
  .wday.none .wdate { background:rgba(255,255,255,.03); box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.06); flex-direction:row; gap:6px; padding:14px 0; }
  .wday.none .wdate small, .wday.none .wdate span { font-size:12px; letter-spacing:.06em; }
  .wday.none .wdate b { font-size:26px; margin:0; } .wday.none .wdate small { color:rgba(255,255,255,.5); }
  .wday.today .wdate { background:linear-gradient(160deg, var(--h1), var(--h2)); box-shadow:0 0 24px -4px color-mix(in srgb, var(--h1) 70%, transparent); }
  .wday.today .wdate small, .wday.today .wdate span { color:#fff; }
  .wevs { display:flex; flex-direction:column; gap:10px; min-width:0; }
  .wnone { height:100%; display:flex; align-items:center; padding:0 20px; border-radius:18px; font-size:17px; font-weight:800; color:rgba(255,255,255,.35); border:2px dashed rgba(255,255,255,.08); }
  .dcard.wev { flex:1 1 auto; min-height:150px; padding:18px 20px 18px 24px; }
  .dcard.wev .nm { font-size:48px; -webkit-line-clamp:2; } .dcard.wev .nm.long { font-size:30px; }
  .dcard.wev .kind { font-size:17px; } .dcard.wev .tm { font-size:21px; }
  .dcard.wev .art { width:360px; height:230px; }
  .dcard.wev .art.n1 img { height:270px; top:-20px; }
  .dcard.wev .art.n2 img { width:185px; height:185px; }
  .dcard.wev .art.n3 img { width:160px; height:160px; } .dcard.wev .art.n3 img:nth-child(1){ left:100px; }
  .dcard.wev .art.n4 img { width:135px; height:135px; }
  .raids { display:grid; grid-template-columns:minmax(0, 1fr) 3px minmax(0, 1fr); gap:0 16px; align-items:start; }
  .rsplit { align-self:stretch; border-radius:3px; background:linear-gradient(180deg, transparent, color-mix(in srgb, var(--h1) 70%, #fff), color-mix(in srgb, var(--h2) 70%, #fff), transparent); }
  .rcol { display:flex; flex-direction:column; gap:8px; min-width:0; }
  .rcol-t { font-size:15px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.55); }
  .rcol-t b { font-weight:900; color:#fff; }
  .rcol.end .rcol-t b { color:#fda4af; } .rcol.start .rcol-t b { color:#86efac; }
  .rcol .wnone { height:auto; padding:18px; }
  .rcol.on { margin-top:12px; } .rcol.on .rcol-t b { color:#93c5fd; }
  .bosses.two { grid-template-columns:1fr 1fr 1fr; }
  .rgroup { --c:#ef4444; border-radius:14px; padding:9px 10px 10px; background:linear-gradient(160deg, color-mix(in srgb, var(--c) 20%, transparent), rgba(255,255,255,.03)); box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--c) 40%, transparent); }
  .rgroup.wide { grid-column:1 / -1; }
  .rgroup h3 { margin:0 0 6px 2px; font-size:13px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; color:color-mix(in srgb, var(--c) 55%, #fff); }
  .bosses { display:grid; gap:6px; }

  .boss { --t:#888; position:relative; display:flex; align-items:center; gap:14px; min-width:0; padding:6px 12px 6px 8px; border-radius:12px; overflow:hidden;
    background:radial-gradient(160px 140px at 70px 50%, color-mix(in srgb, var(--t) 40%, transparent), transparent 75%), rgba(0,0,0,.22);
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.07); }
  .bart { flex-shrink:0; width:66px; height:66px; position:relative; }
  .bart img { position:absolute; inset:-8%; width:116%; height:116%; object-fit:contain; filter:drop-shadow(0 6px 6px rgba(0,0,0,.45)); }

  .btx { min-width:0; flex:1; }
  .bweak { display:flex; align-items:center; gap:3px; margin-top:4px; }
  .bweak small { font-size:9.5px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.5); margin-right:3px; }
  .bweak span { position:relative; } .bweak img { width:20px; height:20px; display:block; }
  .bweak em { position:absolute; right:-5px; bottom:-4px; font-style:normal; font-size:8px; font-weight:900; background:#ef4444; color:#fff; border-radius:4px; padding:0 2px; }
  .bosses.solo .boss { padding:10px 18px 10px 12px; }
  .bosses.solo .bart { width:96px; height:96px; }
  .bosses.solo .bn { font-size:24px; } .bosses.solo .bd { font-size:15px; }
  .bosses.solo .bweak img { width:28px; height:28px; } .bosses.solo .bweak small { font-size:11px; }
  .bosses.solo .bcp > div { min-width:80px; } .bosses.solo .bcp b { font-size:24px; }
  .btypes { display:inline-flex; gap:3px; margin-left:7px; vertical-align:-3px; }
  .btypes img { width:20px; height:20px; }
  .ntypes { display:inline-flex; gap:5px; margin-left:12px; vertical-align:middle; position:relative; top:-3px; } .ntypes img { width:34px; height:34px; }
  /* same three columns on every day card: text | info | art */
  .dcard.wev { display:grid; grid-template-columns:minmax(0, 1fr) 400px 300px; align-items:center; gap:14px; }
  .dcard.wev .art, .dcard.wev .art.n4 { width:300px; }
  .dcard.wev .dside { width:auto; margin:0; }
  .dside { flex-shrink:0; display:flex; flex-direction:column; gap:8px; justify-content:center; width:400px; margin-right:6px; position:relative; z-index:2; }
  .dside small { display:flex; align-items:center; gap:5px; font-size:14px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.55); }
  .dside small img { width:26px; height:26px; }
  .ds-cp { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .ds-cp i { grid-column:1 / -1; font-style:normal; font-size:14px; font-weight:900; color:rgba(255,255,255,.75); margin-bottom:-4px; }
  .ds-cp > div, .ds-weak, .ds-bonus { background:rgba(0,0,0,.28); border-radius:12px; padding:8px 12px; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.06); padding:10px 14px; }
  .ds-cp b { display:block; font-size:44px; font-weight:900; line-height:1.05; color:#ffd54a; }
  .ds-cp .bst b { color:#7dd3fc; }
  .ds-weak div { display:flex; flex-wrap:wrap; gap:5px; margin-top:4px; }
  .ds-weak span { position:relative; } .ds-weak img { width:42px; height:42px; display:block; }
  .ds-weak em { position:absolute; right:-6px; bottom:-4px; font-style:normal; font-size:11px; font-weight:900; background:#ef4444; color:#fff; border-radius:6px; padding:0 3px; }
  .ds-bonus { background:rgba(253,230,138,.12); box-shadow:inset 0 0 0 1.5px rgba(253,230,138,.35); padding:12px 14px; }
  .ds-bonus small { color:#fde68a; } .ds-bonus b { display:block; font-size:40px; font-weight:900; color:#fde68a; line-height:1.1; margin-top:2px; }
  .dmeta { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:10px; }
  .dtypes { display:inline-flex; gap:5px; } .dtypes img { width:32px; height:32px; }
  .dbonus { font-size:19px; font-weight:900; color:#fde68a; background:rgba(253,230,138,.12); box-shadow:inset 0 0 0 1.5px rgba(253,230,138,.35); padding:5px 12px; border-radius:10px; }
  .dcp { display:inline-flex; align-items:center; gap:7px; background:rgba(0,0,0,.3); padding:5px 12px; border-radius:10px; font-weight:900; }
  .dcp i { font-style:normal; font-size:14px; color:rgba(255,255,255,.7); margin-right:2px; }
  .dcp small { font-size:12px; letter-spacing:.1em; color:rgba(255,255,255,.55); }
  .dcp b { font-size:22px; color:#ffd54a; } .dcp b.bst { color:#7dd3fc; }
  .dwx { display:inline-flex; gap:2px; margin-left:6px; } .dwx img { width:24px; height:24px; }
  /* 4 Pokémon (e.g. all Deoxys formes): tight 2x2 */
  .dcard.wev .art.n4 { width:290px; }
  .dcard.wev .art.n4 img { width:150px; height:150px; }
  .dcard.wev .art.n4 img:nth-child(1){ left:0; top:-22px; } .dcard.wev .art.n4 img:nth-child(2){ right:0; top:-22px; }
  .dcard.wev .art.n4 img:nth-child(3){ left:0; bottom:-22px; } .dcard.wev .art.n4 img:nth-child(4){ right:0; bottom:-22px; }
  .bcp { display:flex; gap:6px; flex-shrink:0; }
  .bcp > div { display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:58px; padding:4px 7px; border-radius:9px; background:rgba(0,0,0,.3); }
  .bcp small { display:flex; gap:2px; align-items:center; height:18px; font-size:10.5px; font-weight:900; letter-spacing:.1em; color:rgba(255,255,255,.55); }
  .bcp small img { width:20px; height:20px; }
  .bcp b { font-size:17px; font-weight:900; line-height:1.1; color:#ffd54a; }
  .bcp .bst b { color:#7dd3fc; }
  .orb { --t:#888; flex-shrink:0; width:76px; height:76px; border-radius:50%; position:relative;
    background:radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--t) 55%, #2a2f3d) 0%, color-mix(in srgb, var(--t) 20%, #151821) 75%);
    border:3px solid color-mix(in srgb, var(--t) 60%, #000); }
  .orb img { position:absolute; left:-14%; top:-18%; width:128%; height:128%; object-fit:contain; filter:drop-shadow(0 3px 3px rgba(0,0,0,.4)); }
  .boss .bn { font-size:18px; font-weight:900; line-height:1.1; text-shadow:0 2px 0 rgba(0,0,0,.25); }
  .boss .bd { font-size:13px; font-weight:800; color:rgba(255,255,255,.7); margin-top:2px; line-height:1.3; }

  .empty { text-align:center; padding:40px 20px; font-size:20px; font-weight:800; color:rgba(255,255,255,.5); }
  .p-foot { display:flex; justify-content:space-between; align-items:center; padding:16px 36px 22px; font-size:17px; font-weight:800; color:rgba(255,255,255,.55); }
  .p-foot b { color:#fff; }
</style>
</head>
<body>
<div class="bar">
  <button data-mode="week">Week</button><button data-mode="month">Month</button>
  <button id="prev">‹</button><button id="next">›</button>
  <button id="export">Export PNG</button>
  <span class="status" id="status"></span>
</div>
<div class="stage"><div class="poster" id="poster"></div></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const DAY = 86400000;
const MAX_EVENT_HOURS = 24; // only short (1-day) events go on the calendar
const Q = new URLSearchParams(location.search);
const EMBEDDED = !!Q.get('embed');
let mode = Q.get('mode') === 'month' ? 'month' : 'week';
let offset = parseInt(Q.get('offset') || '0', 10) || 0;
let data = { events: [], debuts: [] };

function footCredit(){ try { return localStorage.getItem('ig_foot') || '@LazySan'; } catch { return '@LazySan'; } }

const TYPE_COLORS = { normal:'#a8a77a', fire:'#ee8130', water:'#6390f0', electric:'#f7d02c', grass:'#7ac74c', ice:'#96d9d6', fighting:'#c22e28', poison:'#a33ea1', ground:'#e2bf65', flying:'#a98ff3', psychic:'#f95587', bug:'#a6b91a', rock:'#b6a136', ghost:'#735797', dragon:'#6f35fc', dark:'#705746', steel:'#b7b7ce', fairy:'#d685ad' };
const typeColor = p => TYPE_COLORS[(p && p.types && p.types[0]) || ''] || '#8b93a7';

// Day-event look (mirrors the site's getEventContext; used when the site didn't send one)
function eventKind(title){
  const t = title.toLowerCase();
  if (t.includes('spotlight hour')) return ['Spotlight Hour', '#fcd34d'];
  if (t.includes('raid hour')) return ['Raid Hour', '#f87171'];
  if (t.includes('community day')) return ['Community Day', '#34d399'];
  if (t.includes('max monday')) return ['Max Monday', '#fb923c'];
  if (t.includes('hatch day')) return ['Hatch Day', '#38bdf8'];
  if (t.includes('max battle day')) return ['Max Battle Day', '#f97316'];
  if (t.includes('raid day')) return ['Super Mega Raid Day', '#fb7185'];
  return ['Event', '#60a5fa'];
}

// Raid boss rotations (multi-day) shown in their own section
const RAID_TIERS = [
  { k:'5star',  label:'5★ Raids',     c:'#ef4444', re:/\bin 5-star raid/i },
  { k:'mega',   label:'Mega Raids',   c:'#a855f7', re:/\bin (super )?mega raids/i },
  { k:'shadow', label:'Shadow Raids', c:'#6366f1', re:/\bin shadow raids/i },
  { k:'max',    label:'Max Battles',  c:'#ec4899', re:/\bin max battles\b/i },
];

function isTba(v){
  if (!v) return true;
  if (typeof v !== 'string') return isNaN(new Date(v).getTime());
  const t = v.trim().toLowerCase();
  if (!t || t === 'tba' || t === 'null') return true;
  if (t.includes('23:59:00.000-0700') || t.includes('23:59:00.000-0800')) return true;
  return isNaN(new Date(v).getTime());
}

// Name shown when the site gave no Pokémon for an event
function shortTitle(t){
  return t.split(' | ')[0].replace(/^Pokémon GO\s+/i, '').replace(/^Pokémon (?=Night Out)/i, '').replace(/\s+20\d\d\b/g, '')
    .replace(/\s+(Spotlight Hour|Raid Hour|Community Day)$/i, '').replace(/\s+during Max Monday$/i, '')
    .replace(/^Max Monday:\s*Pokémon to be announced$/i, 'To be announced').trim() || t;
}
const joinNames = ns => ns.length <= 1 ? (ns[0] || '') : ns.slice(0, -1).join(', ') + ' & ' + ns[ns.length - 1];

function normalise(raw){
  const seen = new Set(), out = [];
  (raw || []).forEach(ev => {
    const title = ev.title || ev.name || '';
    if (!title || isTba(ev.start) || isTba(ev.end)) return;
    const start = new Date(ev.start), end = new Date(ev.end);
    if (!(end > start)) return;
    const key = title + '|' + start.getTime();
    if (seen.has(key)) return; seen.add(key);
    const [kl, kc] = eventKind(title);
    out.push({ title, start, end, hours: (end - start) / 3600000, banner: ev.banner || ev.image || '', loc: ev.loc || null,
      kind: ev.typeLabel && ev.typeLabel !== 'Event' ? ev.typeLabel : kl, color: ev.color && ev.typeLabel !== 'Event' ? ev.color : kc,
      pokemon: (ev.pokemon || []).filter(p => p && p.img), bonus: ev.bonus || null });
  });
  return out.sort((a, b) => a.start - b.start);
}

// ---------- Dates ----------
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const mondayOf = d => addDays(startOfDay(d), -((d.getDay() + 6) % 7));
const sameDay = (a, b) => startOfDay(a).getTime() === startOfDay(b).getTime();
const hm = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
const md = d => d.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
const wd = d => d.toLocaleDateString('en-GB', { weekday:'short' });

function period(){
  const now = new Date();
  if (mode === 'week') { const from = addDays(mondayOf(now), offset * 7); return { from, to: addDays(from, 7) }; }
  const from = new Date(now.getFullYear(), now.getMonth() + offset, 1);
  return { from, to: new Date(from.getFullYear(), from.getMonth() + 1, 1) };
}

// ---------- Collect what goes on the poster ----------
function collect(p){
  const evs = normalise(data.events).filter(e => e.end > p.from && e.start < p.to);
  const dayItems = evs.filter(e => e.hours <= MAX_EVENT_HOURS && e.start >= p.from && !RAID_TIERS.some(t => t.re.test(e.title)))
    .map(e => ({ title: e.title, bonus: e.bonus, date: e.start, kind: e.kind, color: e.color, loc: e.loc, time: `${hm(e.start)} – ${hm(e.end)}`,
      names: e.pokemon.length ? joinNames(e.pokemon.map(x => x.name)) : shortTitle(e.title),
      pokemon: e.pokemon.slice(0, 4), banner: e.pokemon.length ? '' : e.banner, glow: e.pokemon.length ? typeColor(e.pokemon[0]) : e.color }));
  (data.debuts || []).forEach(d => {
    const date = new Date(d.date);
    if (isNaN(date) || date < p.from || date >= p.to || !d.img) return;
    dayItems.push({ date, kind: 'Debut', color: '#ff8c66', time: 'New in Pokémon GO', names: d.name, pokemon: [{ ...d }], banner: '', glow: typeColor(d) });
  });
  dayItems.sort((a, b) => a.date - b.date);

  const raids = RAID_TIERS.map(t => ({ ...t, bosses: evs.filter(e => t.re.test(e.title)).flatMap(e => e.pokemon.length
    ? e.pokemon.map(x => ({ name: x.name, poke: { ...x }, start: e.start, end: e.end, title: e.title }))
    : [{ name: shortTitle(e.title).replace(/\s+in .*$/i, ''), poke: null, start: e.start, end: e.end }]) })).filter(t => t.bosses.length);
  // the same boss returning in the period is one entry with several date ranges
  raids.forEach(t => {
    t.bosses = t.bosses.reduce((acc, b) => {
      const prev = acc.find(x => x.name === b.name);
      const last = prev && prev.ranges[prev.ranges.length - 1];
      if (last && b.start - last[1] <= DAY) { if (b.end > last[1]) last[1] = b.end; }
      else if (prev) prev.ranges.push([b.start, b.end]);
      else acc.push({ ...b, ranges: [[b.start, b.end]] });
      return acc;
    }, []);
  });
  return { dayItems, raids };
}

// ---------- Rendering ----------
function artHTML(it){
  if (it.pokemon.length) return `<div class="art n${it.pokemon.length}">${it.pokemon.map(x => `<img src="${x.data}" alt="">`).join('')}</div>`;
  if (it.bannerData) return `<div class="art banner"><img src="${it.bannerData}" alt=""></div>`;
  return '';
}

const GO_CHART = { normal:{se:[],nve:['rock','steel'],ne:['ghost']}, fire:{se:['grass','ice','bug','steel'],nve:['fire','water','rock','dragon']},
  water:{se:['fire','ground','rock'],nve:['water','grass','dragon']}, electric:{se:['water','flying'],nve:['electric','grass','dragon'],ne:['ground']},
  grass:{se:['water','ground','rock'],nve:['fire','grass','poison','flying','bug','dragon','steel']}, ice:{se:['grass','ground','flying','dragon'],nve:['fire','water','ice','steel']},
  fighting:{se:['normal','ice','rock','dark','steel'],nve:['poison','flying','psychic','bug','fairy'],ne:['ghost']}, poison:{se:['grass','fairy'],nve:['poison','ground','rock','ghost'],ne:['steel']},
  ground:{se:['fire','electric','poison','rock','steel'],nve:['grass','bug'],ne:['flying']}, flying:{se:['grass','fighting','bug'],nve:['electric','rock','steel']},
  psychic:{se:['fighting','poison'],nve:['psychic','steel'],ne:['dark']}, bug:{se:['grass','psychic','dark'],nve:['fire','fighting','poison','flying','ghost','steel','fairy']},
  rock:{se:['fire','ice','flying','bug'],nve:['fighting','ground','steel']}, ghost:{se:['psychic','ghost'],nve:['dark'],ne:['normal']},
  dragon:{se:['dragon'],nve:['steel'],ne:['fairy']}, dark:{se:['psychic','ghost'],nve:['fighting','dark','fairy']},
  steel:{se:['ice','rock','fairy'],nve:['fire','water','electric','steel']}, fairy:{se:['fighting','dragon','dark'],nve:['fire','poison','steel']} };
function weakTo(def){
  return Object.keys(GO_CHART).map(a => { let m = 1; const c = GO_CHART[a];
    def.forEach(d => { if (c.se.includes(d)) m *= 1.6; else if (c.nve.includes(d)) m *= 0.625; else if (c.ne && c.ne.includes(d)) m *= 0.39; });
    return { t: a, m }; }).filter(x => x.m > 1.01).sort((a, b) => b.m - a.m);
}
function daySide(it){
  const blocks = [];
  if (it.bonus) blocks.push(`<div class="ds-bonus"><small>Bonus</small><b>${esc(it.bonus)}</b></div>`);
  if (CATCH_KIND.test(it.kind + ' ' + (it.title || ''))) {
    const pairs = [], seen = new Set();
    it.pokemon.forEach(x => { if (!x.cp) return; const k = x.cp + '/' + x.cpB; if (seen.has(k)) return; seen.add(k); pairs.push(x); });
    pairs.slice(0, 2).forEach(x => {
      const wx = wxOf(x.types);
      blocks.push(`<div class="ds-cp">${pairs.length > 1 ? `<i>${esc(x.name)}</i>` : ''}
        <div><small>Catch CP</small><b>${x.cp}</b></div>
        ${x.cpB ? `<div class="bst"><small>${wx.map(w => icon(WX_URL(w), w)).join('')}${esc(wx.map(w => w.replace(/\b\w/g, c => c.toUpperCase())).join(' · '))}</small><b>${x.cpB}</b></div>` : ''}
      </div>`);
    });
    // weaknesses of the boss (same typing for all its formes)
    const def = (it.pokemon[0] && it.pokemon[0].types) || [];
    const wk = def.length ? weakTo(def) : [];
    if (wk.length) blocks.push(`<div class="ds-weak"><small>Weak to</small><div>${wk.slice(0, 6).map(w => `<span>${icon(TYPE_ICON(w.t), w.t)}${w.m > 2 ? '<em>×2</em>' : ''}</span>`).join('')}</div></div>`);
  }
  return `<div class="dside">${blocks.join('')}</div>`; // always there, so every card has the same columns
}

// One row per day (Mon -> Sun): date block on the left, that day's events as wide cards on the right
function weekHTML(items, p){
  const today = startOfDay(new Date()).getTime();
  const rows = [];
  for (let k = 0; k < 7; k++) {
    const d = addDays(p.from, k);
    const its = items.filter(it => sameDay(it.date, d));
    const isToday = startOfDay(d).getTime() === today;
    rows.push(`<div class="wday${its.length ? ' has' : ' none'}${isToday ? ' today' : ''}" style="--c:${its[0] ? its[0].color : '#8b93a7'}">
      <div class="wdate"><small>${wd(d).toUpperCase()}</small><b>${d.getDate()}</b><span>${d.toLocaleDateString('en-GB', { month: 'short' })}</span></div>
      <div class="wevs">${its.length ? its.map(it => `
        <div class="dcard wev" style="--c:${it.color}; --g:${it.glow}">
          <div class="tx">
            <div class="kind">${esc(it.kind)}</div>
            <div class="nm${it.names.length > 26 ? ' long' : ''}">${esc(it.names)}${it.pokemon.length ? `<span class="ntypes">${typesHTML(it.pokemon.flatMap(x => x.types || []))}</span>` : ''}</div>
            <span class="tm">${esc(it.time)}</span>${it.loc ? `<span class="loc">📍 ${esc(it.loc)}</span>` : ''}
          </div>
          ${daySide(it)}
          ${artHTML(it)}
        </div>`).join('') : '<div class="wnone">No events</div>'}</div>
    </div>`);
  }
  return `<div class="wk">${rows.join('')}</div>`;
}

function monthHTML(items, p){
  const gridFrom = mondayOf(p.from);
  const weeks = Math.ceil(Math.round((startOfDay(p.to) - gridFrom) / DAY) / 7);
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(gridFrom, i);
    const out = d < p.from || d >= p.to;
    const its = out ? [] : items.filter(it => sameDay(it.date, d));
    cells += `<div class="cell${out ? ' out' : ''}${its.length ? ' has' : ''}" style="--c:${its[0] ? its[0].color : 'transparent'}">
      <div class="dn">${d.getDate()}</div>
      ${its.map(it => `<div class="mev" style="--c:${it.color}">
        ${it.pokemon.length ? `<div class="sp n${Math.min(3, it.pokemon.length)}">${it.pokemon.slice(0, 3).map(x => `<img src="${x.data}" alt="">`).join('')}</div>` : ''}
        <span class="k">${esc(it.kind)}</span>
        <div class="n">${esc(it.names)}</div>
        ${it.kind === 'Debut' ? '' : `<div class="t">${esc(it.time)}</div>`}
      </div>`).join('')}
    </div>`;
  }
  const heads = ['MON','TUE','WED','THU','FRI','SAT','SUN'].map(x => `<div>${x}</div>`).join('');
  return `<div class="mhead">${heads}</div><div class="mgrid">${cells}</div>`;
}

function raidsHTML(raids, p){
  if (!raids.length) return '';
  const card = b => `
        <div class="boss" style="--t:${typeColor(b.poke)}">
          <div class="bart">${b.poke && b.poke.data ? `<img src="${b.poke.data}" alt="">` : ''}</div>
          <div class="btx"><div class="bn">${esc(b.name)}<span class="btypes">${b.poke ? typesHTML(b.poke.types) : ''}</span></div><div class="bd">${b.ranges.map(r => `${md(r[0])} – ${md(r[1])}`).join('<br>')}</div>${b.poke && b.poke.types && b.poke.types.length ? `<div class="bweak"><small>Weak</small>${weakTo(b.poke.types).slice(0, 6).map(w => `<span>${icon(TYPE_ICON(w.t), w.t)}${w.m > 2 ? '<em>×2</em>' : ''}</span>`).join('')}</div>` : ''}</div>
          ${b.cp ? `<div class="bcp"><div><small>CP</small><b>${b.cp}</b></div>${b.boosted ? `<div class="bst"><small>${(b.weather || []).filter(w => w.data).map(w => `<img src="${w.data}" alt="${esc(w.name)}">`).join('') || 'Boosted'}</small><b>${b.boosted}</b></div>` : ''}</div>` : ''}
        </div>`;
  // starting = first appears inside the period; ending = already there and leaves inside the period;
  // ongoing = already there and still there after the period
  const kind = b => b.ranges[0][0] >= p.from ? 'start' : b.ranges[b.ranges.length - 1][1] < p.to ? 'end' : 'on';
  const side = (k, cls = '') => raids.map(t => {
    const bs = t.bosses.filter(b => kind(b) === k);
    const st = cls === 'two' ? ` style="grid-template-columns:repeat(${Math.min(3, bs.length)}, minmax(0, 1fr))"` : '';
    return bs.length ? `<div class="rgroup" style="--c:${t.c}"><h3>${esc(t.label)}</h3><div class="bosses ${cls}${bs.length === 1 && cls === 'two' ? ' solo' : ''}"${st}>${bs.map(card).join('')}</div></div>` : '';
  }).join('');
  const L = side('end'), R = side('start'), O = side('on', 'two');
  const word = mode === 'month' ? 'this month' : 'this week';
  const col = (title, html, cls) => `<div class="rcol ${cls}"><div class="rcol-t">${title}</div>${html || `<div class="wnone">Nothing ${word}</div>`}</div>`;
  return `<div class="sec-t">Raid Bosses</div><div class="raids">
    ${col(`<b>Ending</b> ${word}`, L, 'end')}<div class="rsplit"></div>${col(`<b>Starting</b> ${word}`, R, 'start')}</div>
    ${O ? `<div class="rcol on"><div class="rcol-t"><b>Ongoing</b> · all ${mode === 'month' ? 'month' : 'week'}</div>${O}</div>` : ''}`;
}

// Inline every image as a data URL so the PNG export can read it (proxy when the host sends no CORS headers)
const imgCache = new Map();
function toDataUrl(url){
  if (!url) return Promise.resolve(null);
  if (!imgCache.has(url)) imgCache.set(url, (async () => {
    const tryFetch = async u => {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 12000);
      try {
        const res = await fetch(u, { signal: ctl.signal });
        if (!res.ok) return null;
        const blob = await res.blob();
        if (!blob.type.startsWith('image/')) return null;
        return await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
      } catch { return null; } finally { clearTimeout(t); }
    };
    return await tryFetch(url) || await tryFetch('https://images.weserv.nl/?url=' + encodeURIComponent(url.replace(/^https?:\/\//, '')) + '&w=400&output=png');
  })());
  return imgCache.get(url);
}
const DEFAULT_FORMS = ['normal', 'incarnate', 'altered', 'land', 'aria', 'ordinary', 'standard', 'hero', 'plant', 'overcast', 'west', 'red striped'];
const formArtCache = {};
function formArt(base, form){
  const slug = (base + '-' + form).toLowerCase().replace(/[^a-z0-9]+/g, '-');
  if (!(slug in formArtCache)) formArtCache[slug] = fetch('https://pokeapi.co/api/v2/pokemon/' + slug).then(r => r.ok ? r.json() : null)
    .then(d => d ? `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${d.id}.png` : null).catch(() => null);
  return formArtCache[slug];
}
const titleForms = t => { const m = (t || '').match(/\(([^)]*?)\s+Formes?\)/i);
  return m ? m[1].split(/,\s*|\s+and\s+/i).map(x => x.replace(/^and\s+/i, '').trim()).filter(Boolean) : []; };
async function formsOf(poke, title){
  const forms = titleForms(title);
  if (!poke || forms.length < 2 || /\(/.test(poke.name)) return [poke];
  const arts = await Promise.all(forms.map(fm => DEFAULT_FORMS.includes(fm.toLowerCase()) ? poke.img : formArt(poke.name, fm)));
  return forms.map((fm, i) => ({ ...poke, name: `${poke.name} (${fm})`, img: arts[i] || poke.img }));
}
async function expandForms(raids, dayItems){
  await Promise.all(raids.map(async t => {
    const out = [];
    for (const b of t.bosses) {
      const ps = await formsOf(b.poke, b.title);
      if (ps.length < 2) { out.push(b); continue; }
      ps.forEach(x => out.push({ ...b, name: x.name, poke: x }));
    }
    t.bosses = out;
  }));
  await Promise.all((dayItems || []).map(async it => {
    if (it.pokemon.length !== 1) return;
    const ps = await formsOf(it.pokemon[0], it.title);
    if (ps.length > 1) it.pokemon = ps.slice(0, 4);
  }));
}

const RAID_FILES = ['https://raw.githubusercontent.com/TSGouveia/san-pogodex/data/files/raids.min.json', 'https://cdn.jsdelivr.net/gh/TSGouveia/san-pogodex@data/files/raids.min.json'];
const raidKey = n => String(n || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(' ')
  .filter(w => w && !['shadow', 'incarnate', 'forme', 'form'].includes(w)).sort().join(' ');
const WX_ICON = { sunny: 'clearDay', clear: 'clearDay', rainy: 'rainDay', 'partly cloudy': 'partlyCloudyDay', cloudy: 'overcastDay', windy: 'windyDay', snow: 'snowDay', fog: 'fogDay' };
let raidInfoP = null;
function raidInfo(){
  if (!raidInfoP) raidInfoP = (async () => {
    for (const u of RAID_FILES) {
      try {
        const r = await fetch(u + '?t=' + Math.floor(Date.now() / 600000)); if (!r.ok) continue;
        const d = await r.json();
        const list = Array.isArray(d) ? d : [...(d.current || []), ...(d.schedule || [])];
        const map = new Map();
        list.forEach(x => { const k = raidKey(x.name); if (!map.has(k) && x.combatPower) map.set(k, {
          cp: x.combatPower.normal && x.combatPower.normal.max, boosted: x.combatPower.boosted && x.combatPower.boosted.max,
          weather: (x.boostedWeather || []).map(w => ({ name: w.name, img: WX_ICON[w.name] ? `https://raw.githubusercontent.com/PokeMiners/pogo_assets/master/Images/Weather/weatherIcon_large_${WX_ICON[w.name]}.png` : w.image })) }); });
        return map;
      } catch {}
    }
    return new Map();
  })();
  return raidInfoP;
}
async function attachRaidInfo(raids, dayItems){
  const map = await raidInfo();
  (dayItems || []).forEach(it => it.pokemon.forEach(x => {
    const info = map.get(raidKey(x.name)) || map.get(raidKey(String(x.name).replace(/^mega /i, '')));
    if (info && info.cp && !/^mega /i.test(x.name)) { x.cp = info.cp; x.cpB = info.boosted; }
  }));
  const jobs = [];
  raids.forEach(t => t.bosses.forEach(b => {
    const info = map.get(raidKey(b.name)) || map.get(raidKey('mega ' + b.name));
    if (!info) return;
    b.cp = info.cp; b.boosted = info.boosted;
    b.weather = info.weather.map(w => ({ ...w }));
    b.weather.forEach(w => jobs.push(toDataUrl(w.img).then(d => { w.data = d; })));
  }));
  await Promise.all(jobs);
}

const TYPE_ICON = t => `https://raw.githubusercontent.com/PokeMiners/pogo_assets/master/Images/Types/POKEMON_TYPE_${String(t).toUpperCase()}_BORDERED.png`;
const TYPE_WX = { grass:'sunny', ground:'sunny', fire:'sunny', water:'rainy', electric:'rainy', bug:'rainy', normal:'partly cloudy', rock:'partly cloudy',
  fairy:'cloudy', fighting:'cloudy', poison:'cloudy', dragon:'windy', flying:'windy', psychic:'windy', ice:'snow', steel:'snow', dark:'fog', ghost:'fog' };
const WX_URL = w => `https://raw.githubusercontent.com/PokeMiners/pogo_assets/master/Images/Weather/weatherIcon_large_${WX_ICON[w]}.png`;
const ICONS = {};
const icon = (url, alt, cls = '') => ICONS[url] ? `<img class="${cls}" src="${ICONS[url]}" alt="${esc(alt)}">` : '';
const typesHTML = types => [...new Set(types || [])].map(t => icon(TYPE_ICON(t), t, 'ti')).join('');
const wxOf = types => [...new Set((types || []).map(t => TYPE_WX[t]).filter(Boolean))];
// events where you catch the Pokémon at raid / Max Battle level -> show its catch CP
const CATCH_KIND = /raid hour|raid day|max monday|max battle/i;

async function inlineImages(dayItems, raids){
  const urls = new Set();
  const addTypes = ts => (ts || []).forEach(t => { urls.add(TYPE_ICON(t)); if (TYPE_WX[t]) urls.add(WX_URL(TYPE_WX[t])); });
  Object.keys(TYPE_WX).forEach(t => urls.add(TYPE_ICON(t)));
  dayItems.forEach(it => it.pokemon.forEach(x => addTypes(x.types)));
  raids.forEach(t => t.bosses.forEach(b => b.poke && addTypes(b.poke.types)));
  await Promise.all([...urls].map(u => toDataUrl(u).then(d => { if (d) ICONS[u] = d; })));
  await inlineImages0(dayItems, raids);
}
async function inlineImages0(dayItems, raids){
  const jobs = [];
  dayItems.forEach(it => {
    it.pokemon.forEach(x => jobs.push(toDataUrl(x.img).then(d => { x.data = d; })));
    if (it.banner) jobs.push(toDataUrl(it.banner).then(d => { it.bannerData = d; }));
  });
  raids.forEach(t => t.bosses.forEach(b => { if (b.poke) jobs.push(toDataUrl(b.poke.img).then(d => { b.poke.data = d; })); }));
  await Promise.all(jobs);
  dayItems.forEach(it => { it.pokemon = it.pokemon.filter(x => x.data); });
}

function periodLabel(p){
  if (mode === 'month') return { eyebrow:'Monthly events', title:p.from.toLocaleDateString('en-GB', { month:'long' }), sub:String(p.from.getFullYear()) };
  const last = addDays(p.to, -1);
  const m1 = p.from.toLocaleDateString('en-GB', { month:'short' }), m2 = last.toLocaleDateString('en-GB', { month:'short' });
  const title = m1 === m2 ? `${m1} ${p.from.getDate()} – ${last.getDate()}` : `${m1} ${p.from.getDate()} – ${m2} ${last.getDate()}`;
  return { eyebrow:'Weekly events', title, sub:String(last.getFullYear()) };
}

async function render(){
  const p = period();
  const { dayItems, raids } = collect(p);
  await expandForms(raids, dayItems);
  await attachRaidInfo(raids, dayItems);
  await inlineImages(dayItems, raids);
  const L = periodLabel(p);
  const n = dayItems.length;
  $('poster').innerHTML = `
    <div class="p-head"><span class="p-eyebrow">Pokémon GO · ${esc(L.eyebrow)}</span><div class="p-title">${esc(L.title)}</div>
      <div class="p-sub">${esc(L.sub)} · ${n} event${n === 1 ? '' : 's'}</div></div>
    <div class="p-wrap"><div class="p-body" id="pbody">
      ${mode === 'week' ? weekHTML(dayItems, p) : monthHTML(dayItems, p)}
      ${raidsHTML(raids, p)}
    </div></div>
    <div class="p-foot"><b>${esc(footCredit())}</b></div>`;
  await fitBody();
  return { p };
}

// Keep the 1080x1920 (9:16) frame: shrink the body when it doesn't fit, spread it out when there is room
async function fitBody(){
  await Promise.all([...$('poster').querySelectorAll('img')].map(i => i.decode ? i.decode().catch(() => {}) : null));
  const box = $('poster').querySelector('.p-wrap'), fit = $('pbody');
  const avail = box.clientHeight;
  fit.style.transform = ''; fit.style.width = '1080px'; fit.style.minHeight = ''; fit.classList.remove('spread');
  let s = Math.min(1, avail / fit.scrollHeight);
  for (let i = 0; i < 4 && s < 1; i++) { fit.style.width = (1080 / s) + 'px'; s = Math.max(0.4, Math.min(1, avail / fit.scrollHeight)); }
  if (s < 1) s = Math.min(s, avail / fit.scrollHeight);
  if (s < 1) fit.style.transform = `scale(${s})`;
  else { fit.style.width = '1080px'; fit.style.minHeight = avail + 'px'; fit.classList.add('spread'); }
}

// ---------- Export (same approach as infographic.html) ----------
let fontCSS = null;
async function getFontCSS(){
  if (fontCSS) return fontCSS;
  const link = document.querySelector('link[href*="fonts.googleapis.com/css2"]');
  let css = await (await fetch(link.href)).text();
  const urls = [...new Set([...css.matchAll(/url\((https:[^)]+)\)/g)].map(m => m[1]))];
  const toData = async u => {
    const blob = await (await fetch(u)).blob();
    return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
  };
  const datas = await Promise.all(urls.map(toData));
  urls.forEach((u, i) => { css = css.split(u).join(datas[i]); });
  return fontCSS = css;
}
async function makePng(pixelRatio = 2){
  await document.fonts.ready;
  const node = $('poster');
  const opts = { pixelRatio, width: 1080, height: node.offsetHeight };
  try { opts.fontEmbedCSS = await getFontCSS(); } catch {}
  await htmlToImage.toPng(node, opts).catch(() => {});
  return htmlToImage.toPng(node, opts);
}
function fileName(p){
  const y = p.from.getFullYear(), m = String(p.from.getMonth() + 1).padStart(2, '0'), d = String(p.from.getDate()).padStart(2, '0');
  return mode === 'week' ? `pogo-week-${y}-${m}-${d}.png` : `pogo-month-${y}-${m}.png`;
}

if (EMBEDDED) {
  // ?embed=1&mode=week|month&offset=N -> parent sends {source:'pogo-site', type:'events', events, debuts}; we post back the PNG
  document.documentElement.classList.add('embed');
  const post = m => { try { parent.postMessage(Object.assign({ source: 'pogo-infographic' }, m), location.protocol === 'file:' || location.origin === 'null' ? '*' : location.origin); } catch {} };
  window.addEventListener('message', async e => {
    if (e.source !== parent || !e.data || e.data.source !== 'pogo-site' || e.data.type !== 'events') return;
    data = { events: e.data.events || [], debuts: e.data.debuts || [] };
    try {
      post({ type: 'status', text: 'Loading Pokémon images…' });
      const { p } = await render();
      post({ type: 'status', text: 'Rendering…' });
      const url = await makePng(2);
      post({ type: 'done', url, name: fileName(p) });
    } catch (err) { post({ type: 'error', text: 'Export failed: ' + err.message }); }
  });
  post({ type: 'ready' });
} else {
  // Standalone preview (dev): raw scraped events, without the site's Pokémon matching
  const syncBtns = () => document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  const go = async () => { syncBtns(); $('status').textContent = 'Rendering…'; await render(); $('status').textContent = ''; };
  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { mode = b.dataset.mode; offset = 0; go(); }));
  $('prev').addEventListener('click', () => { offset--; go(); });
  $('next').addEventListener('click', () => { offset++; go(); });
  $('export').addEventListener('click', async () => {
    const url = await makePng(2); const a = document.createElement('a'); a.href = url; a.download = fileName(period()); a.click();
  });
  window.__setData = d => { data = d; return go(); }; // dev harness hook
  fetch(Q.get('src') || '/files/events.json').then(r => r.json()).then(d => { if (!data.events.length) { data.events = d; go(); } })
    .catch(() => { $('status').textContent = 'Open this from the Events section of the site.'; });
}
