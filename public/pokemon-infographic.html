<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoGo Pokémon Infographic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0f1115; color:#e9ecf2; font-family:Nunito, system-ui, sans-serif; }
  .wrap { display:flex; justify-content:center; padding:20px 0; }
  html.embed .wrap { padding:0; }

  .poster { --t1:#888; --t2:#888; width:1080px; flex-shrink:0; position:relative; overflow:hidden; color:#eef1f6;
    background:
      radial-gradient(800px 600px at 100% 0%, color-mix(in srgb, var(--t1) 30%, transparent), transparent 65%),
      radial-gradient(700px 600px at 0% 70%, color-mix(in srgb, var(--t2) 20%, transparent), transparent 65%),
      linear-gradient(180deg, #14121c, #0b0a10); }
  .poster::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.45;
    background-image:
      radial-gradient(1.6px 1.6px at 23px 41px, #fff, transparent),
      radial-gradient(1px 1px at 97px 133px, #fff, transparent),
      radial-gradient(2px 2px at 161px 72px, rgba(255,255,255,.8), transparent),
      radial-gradient(1.2px 1.2px at 211px 187px, #fff, transparent);
    background-size:240px 240px; }
  .poster > * { position:relative; }

  /* ---------- Hero ---------- */
  .hero { display:flex; gap:10px; padding:40px 44px 30px; min-height:420px;
    background:linear-gradient(125deg, color-mix(in srgb, var(--t1) 70%, #000) 0%, color-mix(in srgb, var(--t2) 45%, #120f1a) 70%, transparent 100%); overflow:hidden; }
  .hero::after { content:""; position:absolute; right:-120px; top:-120px; width:620px; height:620px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.18), rgba(255,255,255,.04) 55%, transparent 70%); }
  .h-info { flex:1; min-width:0; z-index:2; display:flex; flex-direction:column; }
  .h-num { font-size:22px; font-weight:900; letter-spacing:.1em; color:rgba(255,255,255,.75); }
  .h-name { font-size:84px; font-weight:900; line-height:.95; margin:4px 0 14px; text-shadow:0 4px 0 rgba(0,0,0,.2); }
  .h-name.long { font-size:62px; }
  .types { display:flex; gap:8px; flex-wrap:wrap; }
  .type { --c:#888; display:inline-flex; align-items:center; font-size:15px; font-weight:900; letter-spacing:.06em; text-transform:uppercase; color:#fff;
    background:var(--c); padding:6px 14px; border-radius:99px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.2), 0 2px 0 rgba(0,0,0,.25); text-shadow:0 1px 1px rgba(0,0,0,.3); }
  .tags { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .tag { font-size:13px; font-weight:900; letter-spacing:.06em; text-transform:uppercase; padding:4px 10px; border-radius:8px; background:rgba(0,0,0,.3); color:rgba(255,255,255,.85); box-shadow:inset 0 0 0 1px rgba(255,255,255,.15); }
  .tag.mega { color:#f0abfc; } .tag.gmax { color:#fda4af; } .tag.shadow { color:#c4b5fd; } .tag.leg { color:#fde68a; }

  .cps { margin-top:auto; padding-top:24px; display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:8px; max-width:560px; }
  .cp { padding:9px 10px 10px; border-radius:14px; background:rgba(0,0,0,.32); box-shadow:inset 0 0 0 1px rgba(255,255,255,.1); }
  .cp small { display:block; font-size:11.5px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.6); }
  .cp b { display:block; font-size:28px; font-weight:900; line-height:1.1; color:#fde68a; }
  .cp em { display:block; font-style:normal; font-size:12px; font-weight:800; color:rgba(255,255,255,.5); }
  .cp.max b { color:#fff; }
  .cps-note { font-size:12.5px; font-weight:800; color:rgba(255,255,255,.55); margin-top:7px; }

  .h-art { width:420px; flex-shrink:0; position:relative; z-index:1; }
  .h-art .main { position:absolute; right:-10px; top:-14px; width:410px; height:410px; object-fit:contain; filter:drop-shadow(0 14px 18px rgba(0,0,0,.45)); }
  .h-art .shiny { position:absolute; right:-6px; bottom:-18px; width:116px; height:116px; border-radius:50%; background:rgba(0,0,0,.35); box-shadow:inset 0 0 0 2px rgba(255,255,255,.18); }
  .h-art .shiny img { position:absolute; inset:-8px; width:132px; height:132px; object-fit:contain; filter:drop-shadow(0 4px 6px rgba(0,0,0,.4)); }
  .h-art .shiny span { position:absolute; left:50%; bottom:-10px; transform:translateX(-50%); font-size:12px; font-weight:900; letter-spacing:.1em; background:#fbbf24; color:#1a1408; padding:2px 9px; border-radius:6px; white-space:nowrap; }

  /* ---------- Cards ---------- */
  .body { display:flex; flex-direction:column; gap:16px; padding:26px 30px 26px; }
  .card { border-radius:20px; padding:18px 20px 20px; background:linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.03)); box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08), 0 4px 0 rgba(0,0,0,.28); }
  .card h3 { margin:0 0 14px; display:flex; align-items:center; gap:10px; font-size:15px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.7); }
  .card h3::before { content:""; width:6px; height:18px; border-radius:3px; background:var(--accent, var(--t1)); }

  /* Evolution line × leagues */
  .fam { display:grid; grid-template-columns:230px repeat(3, minmax(0, 1fr)); gap:8px; align-items:stretch; }
  .fh { font-size:13px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; padding:0 4px 2px; color:color-mix(in srgb, var(--lc) 55%, #fff); display:flex; align-items:baseline; justify-content:space-between; }
  .fh span { font-size:11.5px; letter-spacing:.04em; color:rgba(255,255,255,.45); text-transform:none; }
  .who { display:flex; align-items:center; gap:10px; padding:6px 10px 6px 6px; border-radius:14px; background:rgba(0,0,0,.2); }
  .who.cur { background:color-mix(in srgb, var(--t1) 28%, rgba(0,0,0,.2)); box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--t1) 65%, #fff); }
  .who .o { width:74px; height:74px; flex-shrink:0; position:relative; }
  .who .o img { position:absolute; inset:-6px; width:86px; height:86px; object-fit:contain; filter:drop-shadow(0 4px 4px rgba(0,0,0,.4)); }
  .who b { display:block; font-size:18px; font-weight:900; line-height:1.1; }
  .who small { display:block; font-size:12.5px; font-weight:800; color:#fde68a; margin-top:2px; }
  .cell { --lc:#3b82f6; border-radius:14px; padding:9px 12px; background:linear-gradient(160deg, color-mix(in srgb, var(--lc) 18%, transparent), rgba(0,0,0,.18)); box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--lc) 35%, transparent); min-width:0; display:flex; flex-direction:column; justify-content:center; }
  .cell.best { box-shadow:inset 0 0 0 2.5px #fbbf24, 0 0 18px rgba(251,191,36,.18); }
  .cell.off { opacity:.4; }
  .cell .rk { display:flex; align-items:baseline; gap:8px; font-size:30px; font-weight:900; line-height:1.05; }
  .cell .rk.top { color:#fbbf24; } .cell .rk.good { color:#4ade80; }
  .cell .rk em { font-style:normal; font-size:12.5px; font-weight:800; color:rgba(255,255,255,.55); }
  .cell .ms { font-size:12px; font-weight:800; color:rgba(255,255,255,.65); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cell .sh { display:inline-flex; align-items:center; gap:5px; margin-top:5px; font-size:12px; font-weight:900; color:#ddd6fe; }
  .cell .sh i { font-style:normal; font-size:10px; letter-spacing:.06em; background:rgba(124,58,237,.5); padding:1px 6px; border-radius:5px; }
  .fam-note { font-size:12.5px; font-weight:800; color:rgba(255,255,255,.5); margin-top:10px; }
  .fam-note b { color:#fbbf24; }

  /* Moves */
  .mrow { display:grid; grid-template-columns:150px 1fr; align-items:start; gap:10px; }
  .mrow + .mrow { margin-top:12px; }
  .mlabel { font-size:13px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.55); padding-top:8px; }
  .chips { display:flex; flex-wrap:wrap; gap:7px; }
  .chips .type { text-transform:none; letter-spacing:0; font-size:14.5px; }
  .type.elite { box-shadow:inset 0 -3px 0 rgba(0,0,0,.2), 0 0 0 2px #fde68a; }
  .type .el { margin-left:6px; font-size:11px; color:#fde68a; }
  .type .pv { margin-left:6px; font-size:10.5px; font-weight:900; background:rgba(0,0,0,.35); padding:1px 5px; border-radius:5px; }
  .legend { font-size:12.5px; font-weight:800; color:rgba(255,255,255,.5); margin-top:12px; }

  /* How to get (active only) */
  .ways { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; }
  .way { padding:10px 13px; border-radius:12px; background:rgba(0,0,0,.22); min-width:0; }
  .way b { display:block; font-size:16px; font-weight:900; }
  .way span { display:block; font-size:13.5px; font-weight:700; color:rgba(255,255,255,.65); line-height:1.3; margin-top:2px; }

  .p-foot { padding:0 36px 22px; font-size:17px; font-weight:800; color:#fff; }
</style>
</head>
<body>
<div class="wrap"><div class="poster" id="poster"></div></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const Q = new URLSearchParams(location.search);
const TYPE_COLORS = { normal:'#9fa19f', fire:'#e62829', water:'#2980ef', electric:'#fac000', grass:'#3fa129', ice:'#3dcef3', fighting:'#ff8000', poison:'#9141cb', ground:'#915121', flying:'#81b9ef', psychic:'#ef4179', bug:'#91a119', rock:'#afa981', ghost:'#704170', dragon:'#5060e1', steel:'#60a1b8', dark:'#624d4e', fairy:'#ef70ef' };
const tc = t => TYPE_COLORS[t] || '#888';
const cap = s => String(s || '').replace(/\b\w/g, c => c.toUpperCase());
function footCredit(){ try { return localStorage.getItem('ig_foot') || '@LazySan'; } catch { return '@LazySan'; } }

const moveChip = m => `<span class="type${m.elite ? ' elite' : ''}" style="--c:${tc(m.type)}">${esc(m.name)}${m.elite ? '<span class="el">★ Elite</span>' : ''}${m.pvp ? '<span class="pv">PvP</span>' : ''}</span>`;

function heroHTML(p){
  const c = p.cps || {};
  const tags = [
    p.legendary === 'POKEMON_CLASS_LEGENDARY' ? '<span class="tag leg">Legendary</span>' : '',
    p.legendary === 'POKEMON_CLASS_MYTHIC' ? '<span class="tag leg">Mythical</span>' : '',
    p.mega ? '<span class="tag mega">Mega</span>' : '',
    p.gmax ? '<span class="tag gmax">Gigantamax</span>' : '',
    p.shadow ? '<span class="tag shadow">Shadow</span>' : '',
    p.buddy ? `<span class="tag">Buddy ${esc(p.buddy)} km</span>` : '',
  ].join('');
  const cp = (label, sub, v, cls = '') => v ? `<div class="cp ${cls}"><small>${label}</small><b>${v}</b><em>${sub}</em></div>` : '';
  return `<div class="hero">
    <div class="h-info">
      <div class="h-num">#${esc(p.num)}</div>
      <div class="h-name${p.name.length > 11 ? ' long' : ''}">${esc(p.name)}</div>
      <div class="types">${p.types.map(t => `<span class="type" style="--c:${tc(t)}">${esc(cap(t))}</span>`).join('')}</div>
      <div class="tags">${tags}</div>
      ${c.raidsL20 ? `<div class="cps">
        ${cp('Research', 'Level 15', c.researchL15 && c.researchL15.max)}
        ${cp('Raids · Eggs', 'Level 20', c.raidsL20.max)}
        ${cp('Boosted', 'Level 25 · weather', c.raidsWbL25 && c.raidsWbL25.max)}
        ${cp('Max CP', 'Level 50', c.maxL50, 'max')}
      </div><div class="cps-note">100% IV (15/15/15) CPs</div>` : ''}
    </div>
    <div class="h-art">
      ${p.imgData ? `<img class="main" src="${p.imgData}" alt="">` : ''}
      ${p.shinyData ? `<div class="shiny"><img src="${p.shinyData}" alt=""><span>SHINY</span></div>` : ''}
    </div>
  </div>`;
}

function familyCard(p){
  if (!p.hasPvp || !p.family.length) return '';
  const fam = p.family;
  // best (lowest) rank per league across the line, normal or shadow
  const best = p.leagues.map((_, li) => Math.min(...fam.map(s => Math.min(s.leagues[li].rank || 1e9, s.leagues[li].shadowRank || 1e9))));
  const head = `<div></div>${p.leagues.map(L => `<div class="fh" style="--lc:${L.color}">${esc(L.label)}<span>${esc(L.cap)}</span></div>`).join('')}`;
  const rows = fam.map(s => `
    <div class="who${s.current ? ' cur' : ''}"><div class="o">${s.data ? `<img src="${s.data}" alt="">` : ''}</div>
      <div><b>${esc(s.name)}</b>${s.candy ? `<small>Evolve: ${s.candy} candy</small>` : ''}</div></div>
    ${s.leagues.map((l, li) => {
      const has = l.rank || l.shadowRank;
      const isBest = has && best[li] < 1e9 && (l.rank === best[li] || l.shadowRank === best[li]);
      const cls = l.rank && l.rank <= 25 ? 'top' : l.rank && l.rank <= 100 ? 'good' : '';
      return `<div class="cell${has ? '' : ' off'}${isBest ? ' best' : ''}" style="--lc:${p.leagues[li].color}">
        <div class="rk ${cls}">${l.rank ? '#' + l.rank : '—'}${l.rank ? `<em>score ${l.score}</em>` : ''}</div>
        ${l.moveset.length ? `<div class="ms">${esc(l.moveset.join(' · '))}</div>` : ''}
        ${l.shadowRank ? `<div class="sh"><i>SHADOW</i>#${l.shadowRank}</div>` : ''}
      </div>`;
    }).join('')}`).join('');
  const title = fam.length > 1 ? 'Evolution line · PvP ranks' : 'PvP ranks';
  return `<div class="card" style="--accent:#fbbf24"><h3>${title}</h3>
    <div class="fam">${head}${rows}</div>
    <div class="fam-note"><b>Gold border</b> = best of the line in that league · moveset = fast · charged · charged</div>
  </div>`;
}

function movesCard(p){
  if (!p.fast.length && !p.charged.length) return '';
  const anyPvp = [...p.fast, ...p.charged].some(m => m.pvp);
  return `<div class="card"><h3>Moves</h3>
    ${p.fast.length ? `<div class="mrow"><div class="mlabel">Fast</div><div class="chips">${p.fast.map(moveChip).join('')}</div></div>` : ''}
    ${p.charged.length ? `<div class="mrow"><div class="mlabel">Charged</div><div class="chips">${p.charged.map(moveChip).join('')}</div></div>` : ''}
    ${anyPvp ? '<div class="legend">PvP = part of its recommended PvP moveset</div>' : ''}
  </div>`;
}

function waysCard(p){
  const list = (p.obtaining || []).filter(o => o && o.method);
  if (!list.length) return '';
  return `<div class="card" style="--accent:#4ade80"><h3>Available right now</h3><div class="ways">${list.map(o => `<div class="way"><b>${esc(o.method.replace(/^Active\s+/i, ''))}</b><span>${esc(o.desc || '')}</span></div>`).join('')}</div></div>`;
}

// Inline images so the PNG export can read them
const cache = new Map();
function toDataUrl(url){
  if (!url) return Promise.resolve(null);
  if (!cache.has(url)) cache.set(url, (async () => {
    const tryFetch = async u => {
      try {
        const res = await fetch(u); if (!res.ok) return null;
        const blob = await res.blob(); if (!blob.type.startsWith('image/')) return null;
        return await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
      } catch { return null; }
    };
    return await tryFetch(url) || await tryFetch('https://images.weserv.nl/?url=' + encodeURIComponent(url.replace(/^https?:\/\//, '')) + '&w=500&output=png');
  })());
  return cache.get(url);
}

async function render(p){
  $('poster').style.setProperty('--t1', tc(p.types[0]));
  $('poster').style.setProperty('--t2', tc(p.types[1] || p.types[0]));
  [p.imgData, p.shinyData] = await Promise.all([toDataUrl(p.img), toDataUrl(p.shinyImg)]);
  await Promise.all((p.family || []).map(async s => { s.data = await toDataUrl(s.img); }));
  $('poster').innerHTML = `
    ${heroHTML(p)}
    <div class="body">
      ${familyCard(p)}
      ${movesCard(p)}
      ${waysCard(p)}
    </div>
    <div class="p-foot">${esc(footCredit())}</div>`;
}

let fontCSS = null;
async function getFontCSS(){
  if (fontCSS) return fontCSS;
  const link = document.querySelector('link[href*="fonts.googleapis.com/css2"]');
  let css = await (await fetch(link.href)).text();
  const urls = [...new Set([...css.matchAll(/url\((https:[^)]+)\)/g)].map(m => m[1]))];
  const toData = async u => { const b = await (await fetch(u)).blob(); return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); };
  const datas = await Promise.all(urls.map(toData));
  urls.forEach((u, i) => { css = css.split(u).join(datas[i]); });
  return fontCSS = css;
}
async function makePng(pixelRatio = 2){
  await document.fonts.ready;
  const node = $('poster');
  const opts = { pixelRatio, width: 1080, height: node.offsetHeight };
  try { opts.fontEmbedCSS = await getFontCSS(); } catch {}
  await htmlToImage.toPng(node, opts).catch(() => {});
  return htmlToImage.toPng(node, opts);
}
const slug = s => String(s || 'pokemon').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

if (Q.get('embed')) {
  // ?embed=1 -> parent sends {source:'pogo-site', type:'pokemon', pokemon}; we post back the PNG
  document.documentElement.classList.add('embed');
  const post = m => { try { parent.postMessage(Object.assign({ source: 'pogo-infographic' }, m), location.origin); } catch {} };
  window.addEventListener('message', async e => {
    if (e.origin !== location.origin || !e.data || e.data.source !== 'pogo-site' || e.data.type !== 'pokemon') return;
    const p = e.data.pokemon;
    try {
      post({ type: 'status', text: 'Loading artwork…' });
      await render(p);
      post({ type: 'status', text: 'Rendering…' });
      const url = await makePng(2);
      post({ type: 'done', url, name: slug(p.name) + '-infographic.png' });
    } catch (err) { post({ type: 'error', text: 'Export failed: ' + err.message }); }
  });
  post({ type: 'ready' });
} else {
  window.__render = render; // dev preview hook
}
</script>
</body>
</html>
