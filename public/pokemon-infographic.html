<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoGo Pokémon Infographic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0f1115; color:#e9ecf2; font-family:Nunito, system-ui, sans-serif; }
  .wrap { display:flex; justify-content:center; padding:20px 0; }
  html.embed .wrap { padding:0; }

  /* fixed 1080x1350 (4:5 post), same as the raid infographics */
  .poster { --t1:#888; --t2:#888; width:1080px; height:1350px; display:flex; flex-direction:column; flex-shrink:0; position:relative; overflow:hidden; color:#eef1f6;
    background:
      radial-gradient(800px 600px at 100% 0%, color-mix(in srgb, var(--t1) 30%, transparent), transparent 65%),
      radial-gradient(700px 600px at 0% 70%, color-mix(in srgb, var(--t2) 20%, transparent), transparent 65%),
      linear-gradient(180deg, #14121c, #0b0a10); }
  .poster::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.45;
    background-image:
      radial-gradient(1.6px 1.6px at 23px 41px, #fff, transparent),
      radial-gradient(1px 1px at 97px 133px, #fff, transparent),
      radial-gradient(2px 2px at 161px 72px, rgba(255,255,255,.8), transparent),
      radial-gradient(1.2px 1.2px at 211px 187px, #fff, transparent);
    background-size:240px 240px; }
  .poster > * { position:relative; }
  .hero .h-info .cps { max-width:520px; }

  /* ---------- Hero ---------- */
  .hero { display:flex; gap:10px; padding:40px 44px 30px; min-height:420px;
    background:linear-gradient(125deg, color-mix(in srgb, var(--t1) 70%, #000) 0%, color-mix(in srgb, var(--t2) 45%, #120f1a) 70%, transparent 100%); overflow:hidden; }
  .hero::after { content:""; position:absolute; right:-120px; top:-120px; width:620px; height:620px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.18), rgba(255,255,255,.04) 55%, transparent 70%); }
  .h-info { flex:1; min-width:0; z-index:2; display:flex; flex-direction:column; }
  .h-num { font-size:22px; font-weight:900; letter-spacing:.1em; color:rgba(255,255,255,.75); }
  .h-name { font-size:84px; font-weight:900; line-height:.95; margin:4px 0 14px; text-shadow:0 4px 0 rgba(0,0,0,.2); }
  .h-name.long { font-size:62px; }
  .types { display:flex; gap:8px; flex-wrap:wrap; }
  .type { --c:#888; display:inline-flex; align-items:center; font-size:15px; font-weight:900; letter-spacing:.06em; text-transform:uppercase; color:#fff;
    background:var(--c); padding:6px 14px; border-radius:99px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.2), 0 2px 0 rgba(0,0,0,.25); text-shadow:0 1px 1px rgba(0,0,0,.3); }
  .tags { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .tag { font-size:13px; font-weight:900; letter-spacing:.06em; text-transform:uppercase; padding:4px 10px; border-radius:8px; background:rgba(0,0,0,.3); color:rgba(255,255,255,.85); box-shadow:inset 0 0 0 1px rgba(255,255,255,.15); }
  .tag.mega { color:#f0abfc; } .tag.gmax { color:#fda4af; } .tag.shadow { color:#c4b5fd; } .tag.leg { color:#fde68a; }

  .cps { margin-top:auto; padding-top:24px; display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:8px; max-width:560px; }
  .cp { padding:9px 10px 10px; border-radius:14px; background:rgba(0,0,0,.32); box-shadow:inset 0 0 0 1px rgba(255,255,255,.1); }
  .cp small { display:block; font-size:11.5px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.6); }
  .cp b { display:block; font-size:28px; font-weight:900; line-height:1.1; color:#fde68a; }
  .cp em { display:block; font-style:normal; font-size:12px; font-weight:800; color:rgba(255,255,255,.5); }
  .cp.max b { color:#fff; }
  .cps-note { font-size:12.5px; font-weight:800; color:rgba(255,255,255,.55); margin-top:7px; }

  .h-art { width:470px; flex-shrink:0; position:relative; z-index:1; }
  .h-art .main { position:absolute; left:-20px; top:-18px; width:330px; height:330px; object-fit:contain; filter:drop-shadow(0 14px 18px rgba(0,0,0,.45)); }
  /* shiny: soft golden glow and sparkles behind it, no outline; caption underneath */
  .h-art .shiny { position:absolute; right:-6px; bottom:18px; width:232px; height:232px; }
  .h-art .shiny::before { content:""; position:absolute; inset:-14%; border-radius:50%;
    background:radial-gradient(circle, rgba(253,230,138,.42) 0%, rgba(251,191,36,.18) 38%, rgba(251,191,36,.05) 58%, transparent 70%); }
  .h-art .shiny img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 10px 14px rgba(0,0,0,.45)); }
  .h-art .shiny .sp { position:absolute; color:#fde68a; line-height:1; text-shadow:0 0 10px rgba(251,191,36,.9); }
  .h-art .shiny .lab { position:absolute; left:50%; bottom:-30px; transform:translateX(-50%); white-space:nowrap; font-size:16px; font-weight:900; letter-spacing:.18em;
    color:#fde68a; text-shadow:0 2px 0 rgba(0,0,0,.45), 0 0 12px rgba(251,191,36,.55); }
  .h-art .shiny .lab i { font-style:normal; color:#fbbf24; margin-right:6px; }

  /* ---------- Cards ---------- */
  .hero { flex-shrink:0; }
  .body { flex:1; min-height:0; overflow:hidden; position:relative; }
  .fit { display:flex; flex-direction:column; gap:16px; padding:22px 30px 18px; width:1080px; transform-origin:top left; box-sizing:border-box; }
  .fit.spread { justify-content:space-evenly; }
  .card { border-radius:20px; padding:18px 20px 20px; background:linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.03)); box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08), 0 4px 0 rgba(0,0,0,.28); }
  .card h3 { margin:0 0 14px; display:flex; align-items:center; gap:10px; font-size:15px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.7); }
  .card h3::before { content:""; width:6px; height:18px; border-radius:3px; background:var(--accent, var(--t1)); }

  /* Best-of tiles (PvP per league, PvE per type) */
  .tiles { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:12px; }
  .tile { --lc:#3b82f6; position:relative; border-radius:16px; padding:12px 14px 13px; min-width:0;
    background:linear-gradient(160deg, color-mix(in srgb, var(--lc) 24%, transparent), rgba(0,0,0,.2));
    box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--lc) 45%, transparent); }
  .tile.off { opacity:.45; }
  .tile .lbl { font-size:12.5px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; color:color-mix(in srgb, var(--lc) 55%, #fff); display:flex; justify-content:space-between; gap:6px; }
  .tile .lbl span { color:rgba(255,255,255,.45); letter-spacing:.03em; text-transform:none; }
  .tile .row { display:flex; align-items:center; gap:10px; margin-top:6px; }
  .tile .o { width:70px; height:70px; flex-shrink:0; position:relative; }
  .tile .o img { position:absolute; inset:-6px; width:82px; height:82px; object-fit:contain; filter:drop-shadow(0 4px 4px rgba(0,0,0,.4)); }
  .tile .rk { font-size:34px; font-weight:900; line-height:1; }
  .tile .rk.top { color:#fbbf24; } .tile .rk.good { color:#4ade80; }
  .tile .rk em { font-style:normal; font-size:13px; font-weight:800; color:rgba(255,255,255,.55); margin-left:4px; }
  .tile .nm { font-size:16px; font-weight:900; line-height:1.15; margin-top:3px; }
  .tile .vt { display:inline-block; font-size:10.5px; font-weight:900; letter-spacing:.06em; padding:1px 6px; border-radius:5px; margin-right:5px; vertical-align:2px; }
  .tile .vt.sh { background:rgba(124,58,237,.55); color:#ede9fe; } .tile .vt.mg { background:rgba(217,70,239,.5); color:#fdf4ff; }
  .tile .ms { font-size:12.5px; font-weight:800; color:rgba(255,255,255,.7); margin-top:8px; line-height:1.3; }
  .tile .ms b { color:#fde68a; font-weight:900; }
  .note { font-size:12.5px; font-weight:800; color:rgba(255,255,255,.5); margin-top:10px; }

  /* Moves */
  .mrow { display:grid; grid-template-columns:150px 1fr; align-items:start; gap:10px; }
  .mrow + .mrow { margin-top:12px; }
  .mlabel { font-size:13px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.55); padding-top:8px; }
  .chips { display:flex; flex-wrap:wrap; gap:7px; }
  .chips .type { text-transform:none; letter-spacing:0; font-size:14.5px; }
  .type.elite { box-shadow:inset 0 -3px 0 rgba(0,0,0,.2), 0 0 0 2px #fde68a; }
  .type .el { margin-left:6px; font-size:11px; color:#fde68a; }
  .type .pv { margin-left:6px; font-size:10.5px; font-weight:900; background:rgba(0,0,0,.35); padding:1px 5px; border-radius:5px; }
  .legend { font-size:12.5px; font-weight:800; color:rgba(255,255,255,.5); margin-top:12px; }

  /* Evolution tree */
  .et { display:flex; align-items:center; justify-content:center; }
  .kids { display:flex; flex-direction:column; gap:10px; }
  .kids.many { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px 6px; }
  .kid { display:flex; align-items:center; }
  .en { width:128px; flex-shrink:0; text-align:center; }
  .en .o { width:96px; height:96px; margin:0 auto; border-radius:50%; position:relative; background:rgba(0,0,0,.22); box-shadow:inset 0 0 0 2px rgba(255,255,255,.07); }
  .en.cur .o { background:color-mix(in srgb, var(--t1) 32%, rgba(0,0,0,.2)); box-shadow:inset 0 0 0 3px color-mix(in srgb, var(--t1) 70%, #fff); }
  .en .o img { position:absolute; inset:-8px; width:112px; height:112px; object-fit:contain; filter:drop-shadow(0 4px 4px rgba(0,0,0,.4)); }
  .en .n { font-size:15px; font-weight:900; margin-top:6px; line-height:1.1; }
  .kids.many .en { width:104px; } .kids.many .en .o { width:76px; height:76px; } .kids.many .en .o img { width:90px; height:90px; inset:-7px; }
  .ea { width:178px; flex-shrink:0; text-align:center; padding:0 8px; position:relative; }
  .kids.many .ea { width:150px; }
  .ea::after { content:""; display:block; height:3px; margin:6px 6px 0; border-radius:2px; background:linear-gradient(90deg, rgba(255,255,255,.08), rgba(255,255,255,.4)); }
  .ea b { display:block; font-size:15px; font-weight:900; color:#fde68a; }
  .ea .it { display:block; font-size:13px; font-weight:900; color:#a5f3fc; margin-top:2px; }
  .ea .qs { display:block; font-size:12px; font-weight:800; color:rgba(255,255,255,.72); margin-top:3px; line-height:1.25; }

  .p-foot { flex-shrink:0; padding:0 36px 20px; font-size:17px; font-weight:800; color:#fff; }
</style>
</head>
<body>
<div class="wrap"><div class="poster" id="poster"></div></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const Q = new URLSearchParams(location.search);
const TYPE_COLORS = { normal:'#9fa19f', fire:'#e62829', water:'#2980ef', electric:'#fac000', grass:'#3fa129', ice:'#3dcef3', fighting:'#ff8000', poison:'#9141cb', ground:'#915121', flying:'#81b9ef', psychic:'#ef4179', bug:'#91a119', rock:'#afa981', ghost:'#704170', dragon:'#5060e1', steel:'#60a1b8', dark:'#624d4e', fairy:'#ef70ef' };
const tc = t => TYPE_COLORS[t] || '#888';
const cap = s => String(s || '').replace(/\b\w/g, c => c.toUpperCase());
function footCredit(){ try { return localStorage.getItem('ig_foot') || '@LazySan'; } catch { return '@LazySan'; } }

const moveChip = m => `<span class="type${m.elite ? ' elite' : ''}" style="--c:${tc(m.type)}">${esc(m.name)}${m.elite ? '<span class="el">★ Elite</span>' : ''}${m.pvp ? '<span class="pv">PvP</span>' : ''}</span>`;

// sparkles scattered around the shiny artwork: [left %, top %, size px, opacity]
const SPARKLES = [[2, 10, 22, .95], [88, 4, 16, .8], [96, 46, 24, .9], [-6, 58, 14, .7], [12, 88, 18, .85], [80, 86, 13, .65], [50, -6, 12, .6]]
  .map(([l, t, z, o]) => `<span class="sp" style="left:${l}%; top:${t}%; font-size:${z}px; opacity:${o}">✦</span>`).join('');

function heroHTML(p){
  const c = p.cps || {};
  const tags = [
    p.legendary === 'POKEMON_CLASS_LEGENDARY' ? '<span class="tag leg">Legendary</span>' : '',
    p.legendary === 'POKEMON_CLASS_MYTHIC' ? '<span class="tag leg">Mythical</span>' : '',
    p.mega ? '<span class="tag mega">Mega</span>' : '',
    p.gmax ? '<span class="tag gmax">Gigantamax</span>' : '',
    p.shadow ? '<span class="tag shadow">Shadow</span>' : '',
    p.buddy ? `<span class="tag">${esc(p.buddy)} km / candy</span>` : '',
  ].join('');
  const cp = (label, sub, v, cls = '') => v ? `<div class="cp ${cls}"><small>${label}</small><b>${v}</b><em>${sub}</em></div>` : '';
  return `<div class="hero">
    <div class="h-info">
      <div class="h-num">#${esc(p.num)}</div>
      <div class="h-name${p.name.length > 11 ? ' long' : ''}">${esc(p.name)}</div>
      <div class="types">${p.types.map(t => `<span class="type" style="--c:${tc(t)}">${esc(cap(t))}</span>`).join('')}</div>
      <div class="tags">${tags}</div>
      ${c.raidsL20 ? `<div class="cps">
        ${cp('Research', 'Level 15', c.researchL15 && c.researchL15.max)}
        ${cp('Raids · Eggs', 'Level 20', c.raidsL20.max)}
        ${cp('Boosted', 'Level 25', c.raidsWbL25 && c.raidsWbL25.max)}
        ${cp('Max CP', 'Level 50', c.maxL50, 'max')}
      </div><div class="cps-note">100% IV (15/15/15) CPs</div>` : ''}
    </div>
    <div class="h-art">
      ${p.imgData ? `<img class="main" src="${p.imgData}" alt="">` : ''}
      ${p.shinyData ? `<div class="shiny">${SPARKLES}<img src="${p.shinyData}" alt="Shiny"><div class="lab"><i>✦</i>SHINY</div></div>` : ''}
    </div>
  </div>`;
}

const rankCls = r => r && r <= 25 ? 'top' : r && r <= 100 ? 'good' : '';
const variantTag = x => (x.mega ? '<span class="vt mg">MEGA</span>' : '') + (x.shadow ? '<span class="vt sh">SHADOW</span>' : '');

function pvpCard(p){
  if (!p.hasPvp) return '';
  const tiles = p.pvpBest.map(L => {
    const b = L.best;
    if (!b) return `<div class="tile off" style="--lc:${L.color}"><div class="lbl">${esc(L.label)}<span>${esc(L.cap)}</span></div><div class="row"><div class="rk">—</div></div><div class="ms">Not ranked</div></div>`;
    return `<div class="tile" style="--lc:${L.color}">
      <div class="lbl">${esc(L.label)}<span>${esc(L.cap)}</span></div>
      <div class="row"><div class="o">${b.data ? `<img src="${b.data}" alt="">` : ''}</div>
        <div><div class="rk ${rankCls(b.rank)}">#${b.rank}<em>score ${b.score}</em></div>
        <div class="nm">${variantTag(b)}${esc(b.name.replace(/\s*\(Shadow\)/, ''))}</div></div></div>
      <div class="ms">${esc(b.moveset.join(' · '))}</div>
    </div>`;
  }).join('');
  return `<div class="card" style="--accent:#fbbf24"><h3>Best in PvP</h3><div class="tiles">${tiles}</div>
    <div class="note">Best ${p.familySize > 1 ? "of the evolution family " : ""}in each league · PvPoke overall rankings</div></div>`;
}

function pveCard(p){
  if (!p.pveBest || !p.pveBest.length) return '';
  const tiles = p.pveBest.map(r => `<div class="tile" style="--lc:${tc(r.type)}">
      <div class="lbl">${esc(cap(r.type))} attacker${r.total ? `<span>of ${r.total}</span>` : ''}</div>
      <div class="row"><div class="o">${r.data ? `<img src="${r.data}" alt="">` : ''}</div>
        <div><div class="rk ${rankCls(r.rank)}">#${r.rank}<em>${r.edps} eDPS</em></div>
        <div class="nm">${variantTag(r)}${esc(r.name)}</div></div></div>
      <div class="ms">${esc(r.fast)}${r.elite & 1 ? ' <b>★</b>' : ''} · ${esc(r.charged)}${r.elite & 2 ? ' <b>★</b>' : ''}</div>
    </div>`).join('');
  return `<div class="card" style="--accent:#f87171"><h3>Best raid attacker</h3><div class="tiles">${tiles}</div>
    <div class="note">Rank among all attackers of that type · level 40, DialgaDex method · <b style="color:#fde68a">★</b> elite move</div></div>`;
}

function movesCard(p){
  if (!p.fast.length && !p.charged.length) return '';
  const anyPvp = [...p.fast, ...p.charged].some(m => m.pvp);
  return `<div class="card"><h3>Moves</h3>
    ${p.fast.length ? `<div class="mrow"><div class="mlabel">Fast</div><div class="chips">${p.fast.map(moveChip).join('')}</div></div>` : ''}
    ${p.charged.length ? `<div class="mrow"><div class="mlabel">Charged</div><div class="chips">${p.charged.map(moveChip).join('')}</div></div>` : ''}
    ${anyPvp ? '<div class="legend">PvP = part of its recommended PvP moveset</div>' : ''}
  </div>`;
}

function evoNodeHTML(n){
  return `<div class="en${n.current ? ' cur' : ''}"><div class="o">${n.data ? `<img src="${n.data}" alt="">` : ''}</div><div class="n">${esc(n.name)}</div></div>`;
}
function evoReqHTML(n){
  return `<b>${n.candy} candy</b>${n.item ? `<span class="it">+ ${esc(n.item)}</span>` : ''}${(n.quests || []).map(q => `<span class="qs">${esc(q)}</span>`).join('')}`;
}
function evoTreeHTML(n){
  if (!n.children || !n.children.length) return evoNodeHTML(n);
  return `<div class="et">${evoNodeHTML(n)}<div class="kids${n.children.length > 3 ? ' many' : ''}">${n.children.map(c =>
    `<div class="kid"><div class="ea">${evoReqHTML(c)}</div>${evoTreeHTML(c)}</div>`).join('')}</div></div>`;
}
function evoCard(p){
  if (!p.evoTree) return '';
  return `<div class="card"><h3>Evolution</h3>${evoTreeHTML(p.evoTree)}</div>`;
}
function evoNodes(n, out = []){ if (n) { out.push(n); (n.children || []).forEach(c => evoNodes(c, out)); } return out; }

// Inline images so the PNG export can read them
const cache = new Map();
function toDataUrl(url){
  if (!url) return Promise.resolve(null);
  if (!cache.has(url)) cache.set(url, (async () => {
    const tryFetch = async u => {
      try {
        const res = await fetch(u); if (!res.ok) return null;
        const blob = await res.blob(); if (!blob.type.startsWith('image/')) return null;
        return await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
      } catch { return null; }
    };
    return await tryFetch(url) || await tryFetch('https://images.weserv.nl/?url=' + encodeURIComponent(url.replace(/^https?:\/\//, '')) + '&w=500&output=png');
  })());
  return cache.get(url);
}

async function render(p){
  $('poster').style.setProperty('--t1', tc(p.types[0]));
  $('poster').style.setProperty('--t2', tc(p.types[1] || p.types[0]));
  [p.imgData, p.shinyData] = await Promise.all([toDataUrl(p.img), toDataUrl(p.shinyImg)]);
  await Promise.all([...(p.pvpBest || []).map(L => L.best).filter(Boolean), ...(p.pveBest || []), ...evoNodes(p.evoTree)]
    .map(async x => { x.data = await toDataUrl(x.img); }));
  $('poster').innerHTML = `
    ${heroHTML(p)}
    <div class="body"><div class="fit" id="fit">
      ${pveCard(p)}
      ${pvpCard(p)}
      ${evoCard(p)}
      ${movesCard(p)}
    </div></div>
    <div class="p-foot">${esc(footCredit())}</div>`;
  await fitBody();
}

// Keep the 1080x1350 frame: shrink the cards proportionally when they don't fit,
// spread them out when there is room left
async function fitBody(){
  await Promise.all([...$('poster').querySelectorAll('img')].map(i => i.decode ? i.decode().catch(() => {}) : null));
  const box = $('poster').querySelector('.body'), fit = $('fit');
  const avail = box.clientHeight;
  fit.style.transform = ''; fit.style.width = '1080px'; fit.style.minHeight = '';
  fit.classList.remove('spread');
  // scale s so the box fits: lay it out at width 1080/s (scaled back to 1080), re-measure, repeat
  let s = Math.min(1, avail / fit.scrollHeight);
  for (let i = 0; i < 4 && s < 1; i++) {
    fit.style.width = (1080 / s) + 'px';
    s = Math.max(0.5, Math.min(1, avail / fit.scrollHeight));
  }
  if (s < 1) s = Math.min(s, avail / fit.scrollHeight);   // final check at the width actually used
  if (s < 1) {
    fit.style.transform = `scale(${s})`;
  } else {
    fit.style.width = '1080px';
    fit.style.minHeight = avail + 'px';
    fit.classList.add('spread');
  }
}

let fontCSS = null;
async function getFontCSS(){
  if (fontCSS) return fontCSS;
  const link = document.querySelector('link[href*="fonts.googleapis.com/css2"]');
  let css = await (await fetch(link.href)).text();
  const urls = [...new Set([...css.matchAll(/url\((https:[^)]+)\)/g)].map(m => m[1]))];
  const toData = async u => { const b = await (await fetch(u)).blob(); return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); };
  const datas = await Promise.all(urls.map(toData));
  urls.forEach((u, i) => { css = css.split(u).join(datas[i]); });
  return fontCSS = css;
}
async function makePng(pixelRatio = 2){
  await document.fonts.ready;
  const node = $('poster');
  const opts = { pixelRatio, width: 1080, height: node.offsetHeight };
  try { opts.fontEmbedCSS = await getFontCSS(); } catch {}
  await htmlToImage.toPng(node, opts).catch(() => {});
  return htmlToImage.toPng(node, opts);
}
const slug = s => String(s || 'pokemon').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

if (Q.get('embed')) {
  // ?embed=1 -> parent sends {source:'pogo-site', type:'pokemon', pokemon}; we post back the PNG
  document.documentElement.classList.add('embed');
  const post = m => { try { parent.postMessage(Object.assign({ source: 'pogo-infographic' }, m), location.origin); } catch {} };
  window.addEventListener('message', async e => {
    if (e.origin !== location.origin || !e.data || e.data.source !== 'pogo-site' || e.data.type !== 'pokemon') return;
    const p = e.data.pokemon;
    try {
      post({ type: 'status', text: 'Loading artwork…' });
      await render(p);
      post({ type: 'status', text: 'Rendering…' });
      const url = await makePng(2);
      post({ type: 'done', url, name: slug(p.name) + '-infographic.png' });
    } catch (err) { post({ type: 'error', text: 'Export failed: ' + err.message }); }
  });
  post({ type: 'ready' });
} else {
  window.__render = render; // dev preview hook
}
